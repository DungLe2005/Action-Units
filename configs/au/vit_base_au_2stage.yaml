MODEL:
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [16, 16]
  NECK: 'bnneck'
  COS_LAYER: false
  SIE_CAMERA: false
  SIE_VIEW: false
  DEVICE_ID: [0, 1]

INPUT:
  SIZE_TRAIN: [224, 224]
  SIZE_TEST: [224, 224]
  PROB: 0.5 # random horizontal flip prob
  PADDING: 10
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]

DATASETS:
  NAMES: 'disfa'
  ROOT_DIR: './../Face_DATA'

DATALOADER:
  SAMPLER: 'softmax'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  # Global train batch. With DEVICE_ID [0, 1], 128 means about 64 samples/GPU.
  IMS_PER_BATCH: 128

  STAGE1:
    MAX_EPOCHS: 30
    # Prompt tuning only updates a small set of context vectors; 1e-5 underfits.
    BASE_LR: 0.0003
    OPTIMIZER_NAME: 'AdamW'
    WEIGHT_DECAY: 0.0
    CLASS_SPECIFIC_PROMPTS: true
    # Stage 1 uses frozen CLIP image features; single-GPU fp32 avoids
    # DataParallel/autocast shard instabilities on T4.
    USE_DATA_PARALLEL: false
    IMS_PER_BATCH: 128
    CHECKPOINT_PERIOD: 2
    LOG_PERIOD: 0
    EVAL_PERIOD: 1
    WARMUP_EPOCHS: 2
    WARMUP_LR_INIT: 0.00003
    LR_MIN: 0.00001
  
  STAGE2:
    MAX_EPOCHS: 50
    BASE_LR: 0.00005
    BACKBONE_LR_FACTOR: 0.1
    OPTIMIZER_NAME: 'Adam'
    WEIGHT_DECAY: 0.0001
    STEPS: [25, 40]
    GAMMA: 0.1
    WARMUP_FACTOR: 0.01
    # Stage 2 scheduler is stepped once per epoch in this trainer.
    WARMUP_ITERS: 5
    WARMUP_METHOD: 'linear'
    IMS_PER_BATCH: 128
    CHECKPOINT_PERIOD: 5
    LOG_PERIOD: 0
    EVAL_PERIOD: 1
    CENTER_LR: 0.5
    BIAS_LR_FACTOR: 1
    WEIGHT_DECAY_BIAS: 0.0005
    LARGE_FC_LR: false
    # ViT/CLIP AU logits can overflow fp16 on T4; keep Stage 2 in fp32 by default.
    AMP: false
    EARLY_STOP_PATIENCE: 8
    EARLY_STOP_MIN_DELTA: 0.001
    # Soft warning threshold for unusually confident finite logits.
    MAX_LOGIT_ABS: 80.0
    # Hard-fail only if finite logits are clearly divergent in fp32.
    FATAL_LOGIT_ABS: 1000.0
    MAX_LOGIT_WARNINGS: 5
    MAX_GRAD_NORM: 5.0

  SEED: 42

TEST:
  IMS_PER_BATCH: 256
  RE_RANKING: false
  WEIGHT: '' # path to trained model
  NECK_FEAT: 'after'
  FEAT_NORM: 'yes'

OUTPUT_DIR: 'logs/au_vit_base_2stage'
